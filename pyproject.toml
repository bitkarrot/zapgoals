[project]
name = "lnbits-zapgoals"
version = "0.1.13"
# >=3.11 so the dev env can resolve pillow>=13 (security fixes); the extension
# code itself remains 3.10-compatible and LNbits does not pip-resolve it.
requires-python = ">=3.11,<3.13"
description = "LNbits extension for shareable Lightning funding goals."
authors = [{ name = "bitkarrot" }]
urls = { Homepage = "https://github.com/bitkarrot/zapgoals", Repository = "https://github.com/bitkarrot/zapgoals" }
dependencies = ["lnbits~=1.7.1"]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.poetry]
package-mode = false

[tool.uv]
# Security/compat pins for the dev environment only — LNbits does not install
# extension dependencies, so production uses whatever the host LNbits install
# provides. lnbits 1.7.x pins these lower than their CVE-fixed versions:
# pyjwt>=2.15.1 fixes PYSEC-2026-4141/4183 and earlier JWT advisories.
# pillow>=13.0.0 fixes ~20 Pillow advisories (lnbits pins pillow~=12.3.0).
# starlette>=1.3.1 fixes the remaining starlette advisories (lnbits pins
# starlette~=0.48.0); it needs fastapi>=0.165, hence the fastapi override off
# lnbits' ~=0.116.1 pin. pydantic-settings>=2.14.2 fixes its secrets-dir
# symlink advisory (lnbits pins ~=2.12.0). bitstring<5 restores bolt11 compat
# (ConstBitStream). virtualenv>=21.14.13 fixes its activation-script
# advisories; it needs packaging>=26.3, so packaging is overridden off
# lnbits' ~=25.0.0 pin too.
override-dependencies = [
    "bitstring<5",
    "fastapi>=0.165.0",
    "packaging>=26.3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.1",
    "starlette>=1.3.1",
    "virtualenv>=21.14.13",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = [
    "lnbits.*",
    "lnurl.*",
    "loguru.*",
    "pynostr.*",
    "pyqrcode.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = false
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
# Code must stay 3.10-compatible (lnbits supports >=3.10); requires-python is
# only raised for the dev-env security overrides.
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "A", "C", "N", "UP", "RUF", "B"]
ignore = ["C901"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"embed.py" = ["E501", "RUF001"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["validator", "root_validator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
