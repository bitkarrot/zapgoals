[project]
name = "lnbits-zapgoals"
version = "0.1.11"
requires-python = ">=3.10,<3.13"
description = "LNbits extension for shareable Lightning funding goals."
authors = [{ name = "bitkarrot" }]
urls = { Homepage = "https://github.com/bitkarrot/zapgoals", Repository = "https://github.com/bitkarrot/zapgoals" }
dependencies = ["lnbits~=1.6.0"]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.poetry]
package-mode = false

[tool.uv]
# Security/compat pins for the dev environment only (lnbits==1.6.x pins these
# lower). pyjwt>=2.15.1 fixes PYSEC-2026-4141/4183 and earlier JWT advisories.
# starlette>=0.49.1 fixes PYSEC-2026-1942 (CVE-2025-62727); the remaining
# starlette advisories need >=1.0.1, which requires fastapi>=0.128 -> pydantic
# v2, incompatible with lnbits 1.6.x (pydantic~=1.10). fastapi<0.128 keeps
# pydantic-v1 support. bitstring<5 restores bolt11 compat (ConstBitStream).
override-dependencies = [
    "bitstring<5",
    "fastapi>=0.122.0,<0.128.0",
    "pyjwt>=2.15.1",
    "starlette>=0.49.1,<0.51.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = [
    "lnbits.*",
    "lnurl.*",
    "loguru.*",
    "pynostr.*",
    "pyqrcode.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = false
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "A", "C", "N", "UP", "RUF", "B"]
ignore = ["C901"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"embed.py" = ["E501", "RUF001"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["validator", "root_validator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
